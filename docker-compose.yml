name: hynomas

x-common-environment: &common-environment
  PYTHONUNBUFFERED: "1"
  PYTHONPATH: /workspace/Hy-Nomas
  Hy_Nomas_Path: /workspace/Hy-Nomas
  AI_MODEL_STORE: /opt/ai-models
  Hy_Nomas_Model_Path: /opt/ai-models/views/hy-nomas
  HF_HOME: /opt/ai-models/huggingface
  HF_HUB_CACHE: /opt/ai-models/huggingface/hub
  HF_XET_CACHE: /opt/ai-models/huggingface/xet
  HF_ASSETS_CACHE: /opt/ai-models/huggingface/assets
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  TOKENIZERS_PARALLELISM: "false"

services:
  api:
    container_name: hynomas-backend
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: hy-nomas-api
    entrypoint: ["python3", "-u", "/usr/local/bin/hy-nomas-gateway"]
    ports:
      - "127.0.0.1:7879:7979"
    working_dir: /workspace/Hy-Nomas
    environment:
      <<: *common-environment
      NOMAS_GALLERY_DIR: /data/gallery-state/media
      NOMAS_GALLERY_SEED_DIR: /seed-outputs
    volumes:
      - .:/workspace/Hy-Nomas:ro
      - ./.runtime/hynomas:/var/lib/hynomas:rw
      - ./outputs/web:/data/outputs:rw
      - ./outputs:/seed-outputs:ro
      - ./gallery:/data/gallery-state:rw
      - ${AI_MODEL_STORE:-/mnt/A4C45B32C45B2C87/ai-models}/objects:/opt/ai-models/objects:ro
      - ${AI_MODEL_STORE:-/mnt/A4C45B32C45B2C87/ai-models}/views:/opt/ai-models/views:ro
      - ${AI_MODEL_STORE:-/mnt/A4C45B32C45B2C87/ai-models}/huggingface:/opt/ai-models/huggingface:rw
    command:
      - +experiment=single_gpu_low_mem_inference
      - parallelism.tp_size=1
      - --host
      - 0.0.0.0
      - --port
      - "7979"
      - --job-db
      - /var/lib/hynomas/jobs.sqlite
      - --output-dir
      - /data/outputs
      - --gallery-dir
      - /data/gallery-state/media
      - --frontend-dir
      - ""
      - --dit-weight
      - /opt/ai-models/views/hy-nomas/DiT/distilled_int8/diffusion_pytorch_model_ema_0_995_int8.safetensors
      - model.vae.checkpoint=/opt/ai-models/views/hy-nomas/VAE/PixelUMM_FT_FP8/diffusion_pytorch_model_fp8.safetensors
      - model.vae.encoder_checkpoint=/opt/ai-models/views/hy-nomas/VAE/DCAE-V/dc-ae-v-1.0-f32t4c32-bf16.pt
    restart: unless-stopped

  worker:
    container_name: hynomas-worker
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: hy-nomas-api
    ipc: host
    gpus: all
    working_dir: /workspace/Hy-Nomas
    environment:
      <<: *common-environment
      NOMAS_WORKER_ID: hynomas-worker:seg-ar-slot-0
      NOMAS_WORKER_SLOT: seg-ar-slot-0
      TORCH_INDUCTOR_FX_GRAPH_CACHE: "1"
    volumes:
      - .:/workspace/Hy-Nomas:ro
      - ./.runtime/hynomas:/var/lib/hynomas:rw
      - ./.runtime/hynomas/cache:/root/.cache:rw
      - ${AI_MODEL_STORE:-/mnt/A4C45B32C45B2C87/ai-models}/objects:/opt/ai-models/objects:ro
      - ${AI_MODEL_STORE:-/mnt/A4C45B32C45B2C87/ai-models}/views:/opt/ai-models/views:ro
      - ${AI_MODEL_STORE:-/mnt/A4C45B32C45B2C87/ai-models}/huggingface:/opt/ai-models/huggingface:rw
      - ./outputs/web:/data/outputs:rw
    command:
      - --worker-only
      - +experiment=single_gpu_low_mem_inference
      - parallelism.tp_size=1
      - --rollout-type
      - seg_ar
      - --dit-weight
      - /opt/ai-models/views/hy-nomas/DiT/distilled_int8/diffusion_pytorch_model_ema_0_995_int8.safetensors
      - --output-dir
      - /data/outputs
      - --frontend-dir
      - ""
      - --job-db
      - /var/lib/hynomas/jobs.sqlite
      - model.vae.checkpoint=/opt/ai-models/views/hy-nomas/VAE/PixelUMM_FT_FP8/diffusion_pytorch_model_fp8.safetensors
      - model.vae.encoder_checkpoint=/opt/ai-models/views/hy-nomas/VAE/DCAE-V/dc-ae-v-1.0-f32t4c32-bf16.pt
    restart: unless-stopped

  web:
    container_name: hynomas-web
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: hy-nomas-web
    ports:
      - "127.0.0.1:7878:80"
    depends_on:
      - api
    restart: unless-stopped
